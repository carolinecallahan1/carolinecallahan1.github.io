<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/ica11.css">
</head>
<body>
  <h1>Story Time</h1>
  <p class="subtitle"> Funny random generated story! </p>

  <main class="container">

    <div>
      <label for="custom-name">Enter your name:</label>
      <input
        id="custom-name"
        type="text"
        placeholder="Your name here..."
      />
    </div>

    <fieldset>
      <legend>Choose your locale:</legend>

      <label for="us">US</label>
      <input id="us" type="radio" name="uk-us"
             value="us" checked />

      <label for="uk">UK</label>
      <input id="uk" type="radio" name="uk-us"
             value="uk" />
    </fieldset>

    <div>
      <button class="generate" type="button">Generate My Story!</button>
    </div>

    <p class="story" aria-live="polite"></p>

<!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
<p class="story"></p>

<script>
// Complete variable definitions and random functions

const customName = document.getElementById("custom-name");
const generateBtn = document.querySelector(".generate");
const story = document.querySelector(".story");

function randomValueFromArray(array) {
  const random = Math.floor(Math.random() * array.length);
  return array[random];
}

const characters = [
  "a suspiciously fashionable raccoon",
  "a retired disco queen",
  "a dramatic talking flamingo"
];

const places = [
  "a secret underground dance party",
  "the world's fanciest grocery store",
  "a mysterious pink castle"
];

const events = [
  "challenged everyone to a dance battle",
  "accidentally became the new president",
  "revealed they were actually three squirrels in a trench coat"
];

// Partial return random string function

function returnRandomStoryString() {
  const randomCharacter = randomValueFromArray(characters);
  const randomPlace = randomValueFromArray(places);
  const randomEvent = randomValueFromArray(events);

  let storyText = `It was a scorching 94 Fahrenheit outside when Bob received a mysterious invitation from ${randomCharacter}. Naturally, Bob decided to investigate.

    After traveling all the way to ${randomPlace}, things took a very unexpected turn. Without warning, ${randomCharacter} ${randomEvent}!

    The crowd went absolutely wild. Someone dropped their iced coffee, a stranger started screaming, and Bob seriously questioned every life decision that led to this moment.

    To make matters worse, a 300 pounds disco ball suddenly fell from the ceiling. Somehow, nobody was injured.

    Bob decided it was officially time to go home.`;
  return storyText;
}

// Event listener and partial generate function definition

generateBtn.addEventListener("click", generateStory);

function generateStory() {
  let newStory = returnRandomStoryString();

  if (customName.value !== "") {
    const name = customName.value;
    newStory = newStory.replaceAll("Bob", name);
  }

  if (document.getElementById("uk").checked) {
    const weight = `${Math.round(300 / 14)} stone`;
    const temperature = `${Math.round((94 - 32) * (5 / 9))} Celsius`;
    newStory = newStory.replace("300 pounds", weight);
    newStory = newStory.replace("94 Fahrenheit", temperature);
  }

  story.textContent = newStory;
  story.style.visibility = "visible";
}
</script>
</body>
</html>
